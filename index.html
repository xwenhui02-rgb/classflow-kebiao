<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>ClassFlow · 课时 — 个人专属智能课程表</title>
<meta name="description" content="以「现在」为核心的个人学习时间中枢：当前课程、下一节课、今日时间轴、周课表、月历与考试倒计时。">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课时">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/views.css">
</head>
<body>

<!-- ============================ 图标精灵 ============================ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-now" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3.2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
    <symbol id="i-exam" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4V3h6v1"/><path d="M9 13l2 2 4-4"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h9M18 8h2M4 16h4M13 16h7"/><circle cx="15" cy="8" r="2.2"/><circle cx="10.5" cy="16" r="2.2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.4l3.4 2"/></symbol>
    <symbol id="i-time" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.4l3.4 2"/><path d="M3 12h-1M22 12h-1" opacity=".0"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.6"/><path d="M5 20c1.6-3.4 4-5 7-5s5.4 1.6 7 5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6h.01"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 6.5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M5.5 9.5 12 16l6.5-6.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 19.5h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h9a5.5 5.5 0 110 11H8"/><path d="M4 9l4-4M4 9l4 4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.5 2.5 0 00-3.5-3.5L4.5 16.5z"/><path d="M14.5 6.5l3 3"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.5 21 20H3z"/><path d="M12 10v4.5M12 17.2h.01"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5z"/><path d="M4 20.5A2.5 2.5 0 016.5 18H20v3H6.5"/></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M4 9h13v6a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 10.5h1.8a2.7 2.7 0 010 5.4H17"/><path d="M7.5 3v2.5M11.5 3v2.5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 15.5V10a6 6 0 10-12 0v5.5L4.5 18h15z"/><path d="M10 20.5a2.2 2.2 0 004 0"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></symbol>
  </defs>
</svg>

<div class="app">

  <!-- ============================ 顶栏 ============================ -->
  <header class="topbar" id="topbar">
    <button class="datechip" id="datechip" data-preview="false" aria-label="切换日期 / 时间旅行">
      <svg class="icon icon--sm" aria-hidden="true"><use href="#i-calendar"></use></svg>
      <span id="tb-date">—</span>
    </button>
    <div class="topbar__title">
      <span class="topbar__week" id="tb-week">—</span>
    </div>
    <div class="topbar__spacer"></div>
    <div class="topbar__actions" id="topbar-actions">
      <button class="iconbtn" id="nav-settings" aria-selected="false" aria-label="设置" title="设置（/）">
        <svg class="icon" aria-hidden="true"><use href="#i-sliders"></use></svg>
      </button>
    </div>
  </header>

  <!-- ============================ 内容 ============================ -->
  <main class="main">
    <section class="view" id="view-now" role="tabpanel" aria-label="现在"></section>
    <section class="view" id="view-today" role="tabpanel" aria-label="今天"></section>
    <section class="view" id="view-week" role="tabpanel" aria-label="周课表"></section>
    <section class="view" id="view-calendar" role="tabpanel" aria-label="日历"></section>
    <section class="view" id="view-exam" role="tabpanel" aria-label="考试"></section>
    <section class="view" id="view-settings" role="tabpanel" aria-label="设置"></section>
  </main>

  <!-- ============================ 导航 ============================ -->
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="主导航">
    <button class="tab" data-view="now" role="tab" aria-selected="true">
      <svg class="icon" aria-hidden="true"><use href="#i-now"></use></svg><span>现在</span>
    </button>
    <button class="tab" data-view="today" role="tab" aria-selected="false">
      <svg class="icon" aria-hidden="true"><use href="#i-list"></use></svg><span>今天</span>
    </button>
    <button class="tab" data-view="week" role="tab" aria-selected="false">
      <svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg><span>周表</span>
    </button>
    <button class="tab" data-view="calendar" role="tab" aria-selected="false">
      <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg><span>日历</span>
    </button>
    <button class="tab" data-view="exam" role="tab" aria-selected="false">
      <svg class="icon" aria-hidden="true"><use href="#i-exam"></use></svg><span>考试</span>
      <i class="tab__dot" id="tab-exam-dot" aria-hidden="true"></i>
    </button>
  </nav>
</div>

<!-- ============================ 弹层 ============================ -->
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet__grab"></div>
  <div class="sheet__head">
    <h2 class="sheet__title" id="sheet-title">详情</h2>
    <button class="iconbtn" id="sheet-close" aria-label="关闭">
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="sheet__body" id="sheet-body"></div>
</section>

<div class="toast-host" id="toast-host" aria-live="polite"></div>
<input type="file" id="file-input" accept="application/json,.json" hidden>

<script src="assets/js/time.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
